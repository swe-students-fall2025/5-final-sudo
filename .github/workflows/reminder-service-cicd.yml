name: reminder-service-ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-build-push-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expiry-reminder-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (reminder-service)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage (>=80%)
        run: |
          pytest --cov=. --cov-report=term-missing
          coverage report --fail-under=80

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push reminder-service image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: expiry-reminder-service
          file: expiry-reminder-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dockeeper-reminder-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dockeeper-reminder-service:${{ github.sha }}

      - name: Deploy (pull + restart) on DigitalOcean
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DO_DEPLOY_PATH }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
