services:
  mongodb:
    image: mongo:7
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=dockeeper

  web-app:
    build:
      context: .
      dockerfile: web-app/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-dockeeper}
      - SECRET_KEY=${SECRET_KEY}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8000}
      - EMAIL_MODE=${EMAIL_MODE:-mock}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:-}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME:-DocKeeper}
    depends_on:
      - mongodb
    restart: unless-stopped

  reminder-service:
    build:
      context: ./expiry-reminder-service
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-dockeeper}
      - REMINDER_INTERVAL_SECONDS=${REMINDER_INTERVAL_SECONDS:-60}
      - EMAIL_MODE=${EMAIL_MODE:-mock}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:-}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME:-DocKeeper}
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongodb_data:


