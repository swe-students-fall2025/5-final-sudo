services:
  mongodb:
    image: mongo:7
    container_name: dockeeper-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=dockeeper
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  web-app:
    build:
      context: ./web-app
      dockerfile: Dockerfile
    container_name: dockeeper-web-app
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB_NAME=dockeeper
      - SECRET_KEY=${SECRET_KEY:-dev-change-me}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  reminder-service:
    build:
      context: ./expiry-reminder-service
      dockerfile: Dockerfile
    container_name: dockeeper-reminder-service
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB_NAME=dockeeper
      - REMINDER_INTERVAL_SECONDS=60
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongodb_data:


