<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{ title or "DocKeeper" }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        margin: 0;
        padding: 2rem;
        background: #f4f4f5;
      }
      .container {
        max-width: 960px;
        margin: 0 auto;
        background: white;
        padding: 2rem;
        border-radius: 0.75rem;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
      }
      header {
        margin-bottom: 1.5rem;
      }
      h1 {
        margin: 0;
      }
      .subtitle {
        color: #6b7280;
      }
      main {
        margin-top: 1.5rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>DocKeeper</h1>
        <p class="subtitle">
          Track passports, permits, warranties, and anything with an expiry date.
        </p>
      </header>
      <main>
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
