{% extends "base.html" %} {% block content %}

<div
  id="authPanel"
  class="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 flex items-center justify-center p-4"
>
  <div class="w-full max-w-md">
    <!-- HEADER -->
    <div class="text-center mb-8">
      <div class="flex items-center justify-center gap-3 mb-4">
        <div
          class="w-14 h-14 bg-gradient-to-br from-blue-500 to-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-500/30"
        >
          <svg
            class="w-7 h-7"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path
              d="M14 2H6a2 2 0 0 0-2 2v16a2 
                     2 0 0 0 2 2h12a2 2 0 0 
                     0 2-2V8z"
            ></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <line x1="10" y1="9" x2="8" y2="9"></line>
          </svg>
        </div>
        <h1 class="text-gray-900 text-2xl font-semibold">DocKeeper</h1>
      </div>

      <p class="text-gray-600">
        Track passports, permits, warranties, and anything with an expiry date.
      </p>
    </div>

    <!-- CARD -->
    <div class="bg-white rounded-xl shadow-lg border border-gray-200 p-8">
      <!-- TABS -->

      <div class="grid grid-cols-2 mb-6 border-b border-gray-300">
        <!-- ACTIVE by default -->
        <button
          id="tabLogin"
          onclick="switchTab('login')"
          class="py-2 text-center font-medium border-b-2 border-blue-600 text-blue-600"
        >
          Login
        </button>

        <!-- INACTIVE by default -->
        <button
          id="tabRegister"
          onclick="switchTab('register')"
          class="py-2 text-center font-medium border-b-2 border-transparent text-gray-500"
        >
          Register
        </button>
      </div>

      <!-- LOGIN FORM -->
      <div id="loginTabContent">
  <!-- Inline message area (replaces alert/prompt UX) -->
  <div id="loginMessage"
       class="hidden mb-4 rounded-lg border p-3 text-sm"
       role="status"
       aria-live="polite"></div>

        <form id="loginForm" class="space-y-4">
          <div class="space-y-1">
            <label for="loginEmail">Email:</label>
            <input
              id="loginEmail"
              type="email"
              placeholder="Enter your email"
              class="w-full bg-gray-100 rounded-lg px-3 py-2"
              required
            />
          </div>

          <div class="space-y-1">
            <label for="loginPassword">Password:</label>
            <input
              id="loginPassword"
              type="password"
              placeholder="Enter your password"
              class="w-full bg-gray-100 rounded-lg px-3 py-2"
              required
            />
          </div>

          <button
            type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg mt-4"
          >
            Login
          </button>
        </form>
      <div class="text-center mt-3 space-y-2">
        <div>
          <a href="#" onclick="resendVerification(); return false;" class="text-sm text-blue-600 hover:underline">
            Resend verification email
          </a>
        </div>
        <div>
          <a href="#" onclick="showForgotPassword(); return false;" class="text-sm text-blue-600 hover:underline">
            Forgot password?
          </a>
        </div>
      </div>

      </div>

      <!-- REGISTER FORM -->
      <div id="registerTabContent" class="hidden">
  <!-- Inline message area (replaces alert/prompt UX) -->
  <div id="registerMessage"
       class="hidden mb-4 rounded-lg border p-3 text-sm"
       role="status"
       aria-live="polite"></div>

        <form id="registerForm" class="space-y-4">
          <div class="space-y-1">
            <label>Email:</label>
            <input
              id="regEmail"
              type="email"
              placeholder="Enter your email"
              class="w-full bg-gray-100 rounded-lg px-3 py-2"
              required
            />
          </div>

          <div class="space-y-1">
            <label>Password:</label>
            <input
              id="regPassword"
              type="password"
              placeholder="Create a password"
              class="w-full bg-gray-100 rounded-lg px-3 py-2"
              required
            />
          </div>

          <button
            type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg mt-4"
          >
            Register
          </button>
        </form>
      <div class="text-center mt-3">
        <a href="#" onclick="switchTab('login'); return false;" class="text-sm text-blue-600 hover:underline">
          Back to login
        </a>
      </div>
    </div>

    <!-- FORGOT PASSWORD -->
    <div id="forgotTabContent" class="hidden">
      <div id="forgotMessage" class="hidden mb-4 rounded-lg border p-3 text-sm" role="status" aria-live="polite"></div>
      <form id="forgotForm" class="space-y-4">
        <div class="space-y-1">
          <label for="forgotEmail">Email:</label>
          <input id="forgotEmail" type="email" placeholder="Enter your account email" class="w-full bg-gray-100 rounded-lg px-3 py-2" required />
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg mt-4">
          Send reset link
        </button>
      </form>
      <div class="text-center mt-3">
        <a href="#" onclick="switchTab('login'); return false;" class="text-sm text-blue-600 hover:underline">
          Back to login
        </a>
      </div>
    </div>

    <!-- RESET PASSWORD (shown when ?reset_token=... is present) -->
    <div id="resetTabContent" class="hidden">
      <div id="resetMessage" class="hidden mb-4 rounded-lg border p-3 text-sm" role="status" aria-live="polite"></div>
      <form id="resetForm" class="space-y-4">
        <div class="space-y-1">
          <label for="resetPassword">New Password:</label>
          <input id="resetPassword" type="password" placeholder="Create a new password" class="w-full bg-gray-100 rounded-lg px-3 py-2" required />
        </div>
        <div class="space-y-1">
          <label for="resetPassword2">Repeat Password:</label>
          <input id="resetPassword2" type="password" placeholder="Repeat your new password" class="w-full bg-gray-100 rounded-lg px-3 py-2" required />
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg mt-4">
          Reset password
        </button>
      </form>
      <div class="text-center mt-3">
        <a href="#" onclick="switchTab('login'); return false;" class="text-sm text-blue-600 hover:underline">
          Back to login
        </a>
      </div>
    </div>
  </div>
</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">
  {% include "components/dashboard.html" %}
</div>

<script>
  function switchTab(tab) {
  // Clear inline messages when switching tabs
  if (window.clearAuthMessages) window.clearAuthMessages();

    const loginTab = document.getElementById("loginTabContent");
    const registerTab = document.getElementById("registerTabContent");
    const forgotTab = document.getElementById("forgotTabContent");
    const resetTab = document.getElementById("resetTabContent");
    const btnLogin = document.getElementById("tabLogin");
    const btnRegister = document.getElementById("tabRegister");

    // always hide forgot/reset when switching tabs
    if (forgotTab) forgotTab.classList.add("hidden");
    if (resetTab) resetTab.classList.add("hidden");


    if (tab === "login") {
      loginTab.classList.remove("hidden");
      registerTab.classList.add("hidden");

      btnLogin.classList.add("border-blue-600", "text-blue-600");
      btnLogin.classList.remove("border-transparent", "text-gray-500");

      btnRegister.classList.add("border-transparent", "text-gray-500");
      btnRegister.classList.remove("border-blue-600", "text-blue-600");
    } else {
      loginTab.classList.add("hidden");
      registerTab.classList.remove("hidden");

      btnRegister.classList.add("border-blue-600", "text-blue-600");
      btnRegister.classList.remove("border-transparent", "text-gray-500");

      btnLogin.classList.add("border-transparent", "text-gray-500");
      btnLogin.classList.remove("border-blue-600", "text-blue-600");
    }
  }
</script>

{% endblock %}
