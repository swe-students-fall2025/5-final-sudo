{% extends "base.html" %}

{% block content %}
  <h2>Document Tracker</h2>

  <h3>Add Document</h3>
  
<div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow-md">
  <h2 class="text-2xl font-semibold mb-4">Add Document</h2>

  <form id="addForm" class="space-y-5">
    
    <!-- Document Type -->
    <div class="space-y-1">
      <label class="font-medium">Document Type *</label>
      <select 
        id="doc_type" 
        required 
        onchange="handleTypeChange()" 
        class="w-full border rounded-lg px-3 py-2"
      >
        <option value="">Select document type</option>
        <option value="Passport">Passport</option>
        <option value="Visa">Visa</option>
        <option value="License">License</option>
        <option value="Permit">Permit</option>
        <option value="Warranty">Warranty</option>
        <option value="Insurance">Insurance</option>
        <option value="Membership">Membership</option>
        <option value="Certification">Certification</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <!-- Document Name -->
    <div class="space-y-1">
      <label class="font-medium">Document Name *</label>
      <input 
        id="name"
        type="text"
        placeholder="e.g., F1 Visa, Driver License"
        class="w-full border rounded-lg px-3 py-2"
        required
      />
    </div>

    <!-- Label -->
    <div class="space-y-1">
      <label class="font-medium">Label (optional)</label>
      <input 
        id="label"
        type="text"
        placeholder='e.g., "Work", "Personal"'
        class="w-full border rounded-lg px-3 py-2"
      />
    </div>

    <!-- Expiry date + lead time -->
    <div class="grid grid-cols-2 gap-4">
      <div class="space-y-1">
        <label class="font-medium">Expiry Date *</label>
        <input 
          id="expiry_date"
          type="date"
          class="w-full border rounded-lg px-3 py-2"
          required
        />
      </div>

      <div class="space-y-1">
        <label class="font-medium">Lead Time (days) *</label>
        <input 
          id="lead_time"
          type="number"
          class="w-full border rounded-lg px-3 py-2"
          placeholder="90"
          required
        />
      </div>
    </div>

    <!-- Importance -->
    <div class="space-y-1">
      <label class="font-medium">Importance *</label>
      <select 
        id="importance"
        required
        class="w-full border rounded-lg px-3 py-2"
      >
        <option value="">Select importance</option>
        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High">High</option>
        <option value="Critical">Critical</option>
      </select>
    </div>

    <!-- Notes -->
    <div class="space-y-1">
      <label class="font-medium">Notes (optional)</label>
      <textarea 
        id="notes"
        rows="3"
        placeholder="Additional notes..."
        class="w-full border rounded-lg px-3 py-2"
      ></textarea>
    </div>

    <!-- Buttons -->
    <div class="flex gap-3 pt-3">
      <button 
        type="submit"
        class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg"
      >
        Add Document
      </button>

      <button 
        type="button"
        onclick="resetForm()"
        class="flex-1 border border-gray-400 text-gray-700 py-2 rounded-lg"
      >
        Cancel
      </button>
    </div>

  </form>

</div>


  <h3>Documents</h3>
  <button onclick="loadDocuments()">Refresh List</button>
  <div id="documentList"></div>

  <script>
    function toggleAdvancedFields() {
      const docType = document.getElementById('doc_type').value;
      const advancedToggle = document.getElementById('advancedToggle');
      const advancedFields = document.getElementById('advancedFields');
      const advancedButton = advancedToggle.querySelector('button');
      
      if (docType === 'other') {
        advancedFields.style.display = 'block';
        advancedToggle.style.display = 'none';
      } else {
        advancedFields.style.display = 'none';
        advancedToggle.style.display = 'block';
        if (advancedButton) {
          advancedButton.style.display = 'inline-block';
        }
      }
    }

    function getRiskColor(risk) {
      const colors = {
        'CRITICAL': '#ff0000',
        'HIGH': '#ff6600',
        'MEDIUM': '#ffaa00',
        'LOW': '#00aa00'
      };
      return colors[risk] || '#666';
    }
    
    function getImportanceLabel(importance) {
      const labels = {
        2: 'Low',
        3: 'Medium',
        4: 'High',
        5: 'Critical'
      };
      return labels[importance] || importance;
    }

    async function deleteDocument(id) {
      if (!confirm('Delete this document?')) return;
      
      const response = await fetch(`/api/documents/${id}`, {
        method: 'DELETE'
      });

      if (response.ok) {
        loadDocuments();
      } else {
        alert('Error deleting document');
      }
    }

    async function loadDocuments() {
      const response = await fetch('/api/documents');
      const docs = await response.json();
      const list = document.getElementById('documentList');
      
      if (docs.length === 0) {
        list.innerHTML = '<p>No documents yet</p>';
        return;
      }

      list.innerHTML = '<div>' + docs.map(doc => {
        const riskStyle = doc.last_risk ? `color: ${getRiskColor(doc.last_risk)}; font-weight: bold;` : '';
        return `
          <div style="border: 1px solid #ccc; padding: 10px; margin: 10px 0; border-radius: 5px;">
            <strong style="font-size: 1.2em;">${doc.name}</strong><br>
            <strong>Type:</strong> ${doc.doc_type || doc.category}<br>
            <strong>Expires:</strong> ${doc.expiry_date}<br>
            <strong>Importance:</strong> ${getImportanceLabel(doc.importance)} | <strong>Lead Time:</strong> ${doc.renewal_lead_time_days} days<br>
            ${doc.last_risk ? `<strong style="${riskStyle}">Risk Level: ${doc.last_risk}</strong><br>` : ''}
            ${doc.last_days_until !== undefined ? `<strong>Days Until Expiry:</strong> ${doc.last_days_until}<br>` : ''}
            ${doc.last_checked_at ? `<em>Last checked: ${new Date(doc.last_checked_at).toLocaleString()}</em><br>` : ''}
            ${doc.notes ? `<strong>Notes:</strong> ${doc.notes}<br>` : ''}
            <button onclick="deleteDocument('${doc.id}')" style="margin-top: 5px; background: #ff4444; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px;">Delete</button>
          </div>
        `;
      }).join('') + '</div>';
    }

    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const docType = document.getElementById('doc_type').value;
      const advancedVisible = document.getElementById('advancedFields').style.display === 'block';
      
      const doc = {
        doc_type: docType,
        label: document.getElementById('label').value || null,
        expiry_date: document.getElementById('expiry_date').value,
        notes: document.getElementById('notes').value || null
      };
      
      // Only include importance and lead_time if advanced fields are visible
      if (advancedVisible) {
        const importance = document.getElementById('importance').value;
        const leadTime = document.getElementById('lead_time').value;
        if (importance) doc.importance = parseInt(importance);
        if (leadTime) doc.renewal_lead_time_days = parseInt(leadTime);
      }

      const response = await fetch('/api/documents', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(doc)
      });

      if (response.ok) {
        alert('Document added!');
        document.getElementById('addForm').reset();
        loadDocuments();
      } else {
        alert('Error adding document');
      }
    });

    // Initialize advanced fields visibility on page load
    toggleAdvancedFields();
    
    // Load documents on page load
    loadDocuments();
  </script>
{% endblock %}
