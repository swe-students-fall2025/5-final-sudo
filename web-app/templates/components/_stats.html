<header class="bg-white border border-gray-200 rounded-2xl p-6 mb-6 shadow-sm">
  <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-4 mb-6">
    <div>
      <div class="flex items-center gap-3 mb-2">
        <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
          <!-- simple icon -->
          <span class="text-xl">📄</span>
        </div>
        <h1 class="text-2xl font-semibold text-gray-900">DocKeeper</h1>
      </div>
      <p class="text-gray-600 text-sm">
        Track passports, permits, warranties, and anything with an expiry date.
      </p>
    </div>

    {% include "components/_document_form.html" %}
  </div>

  <!-- Stats -->
  <div class="flex flex-wrap gap-3">
    <div class="px-4 py-2 bg-gray-50 rounded-lg border border-gray-200 text-sm">
      <span class="text-gray-600">Total: </span>
      <span id="statTotal" class="text-gray-900 font-medium">0</span>
    </div>
    <div id="statExpiringBox"
         class="hidden px-4 py-2 bg-orange-50 rounded-lg border border-orange-200 text-sm">
      <span class="text-orange-700">⚠️ Action Needed: </span>
      <span id="statExpiring" class="text-orange-900 font-medium">0</span>
    </div>
    <div id="statCriticalBox"
         class="hidden px-4 py-2 bg-red-50 rounded-lg border border-red-200 text-sm">
      <span class="text-red-700">Critical: </span>
      <span id="statCritical" class="text-red-900 font-medium">0</span>
    </div>
  </div>

  {% include "components/_filters.html" %}
</header>
