<div class="flex flex-wrap gap-3 mt-6 items-center">

  <!-- SEARCH BAR -->
  <div class="relative flex-1 min-w-[260px]">
    <span class="absolute left-3 top-1/2 -translate-y-1/2">
      <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2"
           viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </span>

    <input id="searchInput"
           placeholder="Search documents..."
           class="w-full border rounded-md pl-10 pr-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
  </div>

  <!-- TYPE FILTER -->
  <div class="relative">
    <select id="filterType"
            class="appearance-none border rounded-md px-3 py-2 text-sm pr-8 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
      <option value="all">All Types</option>
      <!-- JS injects more here -->
    </select>

    <span class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2">
      <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2"
           viewBox="0 0 24 24">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </span>
  </div>

  <!-- IMPORTANCE FILTER -->
  <div class="relative">
    <select id="filterImportance"
            class="appearance-none border rounded-md px-3 py-2 text-sm pr-8 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
      <option value="all">All Importance</option>
      <option value="Critical">Critical</option>
      <option value="High">High</option>
      <option value="Medium">Medium</option>
      <option value="Low">Low</option>
    </select>

    <span class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2">
      <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2"
           viewBox="0 0 24 24">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </span>
  </div>

</div>
