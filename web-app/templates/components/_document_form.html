
  <div class="bg-white rounded-xl shadow-xl w-full max-w-lg p-6 relative"
       onclick="event.stopPropagation()">

    <!-- Close button -->
    <button onclick="closeModal()"
            class="absolute right-4 top-4 p-2 rounded-full text-gray-400 hover:text-gray-600 transition">
      <svg xmlns="http://www.w3.org/2000/svg"
          class="w-5 h-5"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>

    <!-- HEADER -->
    <h2 class="text-xl font-semibold text-gray-900 mb-2">
      Add New Document
    </h2>
    <p class="text-gray-600 text-sm mb-6">
      Track passports, permits, warranties, subscriptions, and anything with an expiry date.
    </p>

    <!-- FORM -->
    <form id="addForm" class="space-y-5">

      <!-- Document Type -->
      <div class="space-y-1">
        <label for="doc_type" class="block text-sm font-medium">Document Type *</label>
        <div class="relative">
          <select id="doc_type"
                  class="w-full rounded-lg px-3 py-2 bg-gray-100 pr-10 appearance-none">
            <option value="">Select document type</option>
            <option>Passport</option>
            <option>Visa</option>
            <option>License</option>
            <option>Permit</option>
            <option>Warranty</option>
            <option>Insurance</option>
            <option>Membership</option>
            <option>Certification</option>
          </select>

          <!-- dropdown arrow -->
          <svg class="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500 pointer-events-none"
              fill="none" stroke="currentColor" stroke-width="2"
              viewBox="0 0 24 24">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>
      </div>

      <!-- Name -->
      <div class="space-y-1">
        <label for="name" class="block text-sm font-medium">Document Name *</label>
        <input id="name"
               class="w-full bg-gray-100 rounded-lg px-3 py-2"
               placeholder="e.g., Visa (F1), Driver License"
               required>
      </div>

      <!-- Label -->
      <div class="space-y-1">
        <label for="label" class="block text-sm font-medium">Label (optional)</label>
        <input id="label"
               class="w-full bg-gray-100 rounded-lg px-3 py-2"
               placeholder='e.g., "Work", "Personal"'>
      </div>

      <!-- Expiry + Lead Time -->
      <div class="grid grid-cols-2 gap-4">

        <div class="space-y-1">
          <label for="expiry_date" class="text-sm font-medium">Expiry Date *</label>
          <input id="expiry_date"
                 type="date"
                 class="w-full bg-gray-100 rounded-lg px-3 py-2"
                 required>
        </div>

        <div class="space-y-1">
          <label for="lead_time" class="text-sm font-medium">Lead Time (days) *</label>
          <input id="lead_time"
                 type="number"
                 class="w-full bg-gray-100 rounded-lg px-3 py-2"
                 placeholder="90"
                 required>
        </div>

      </div>

      <!-- Advanced Settings -->
      <details class="group border border-gray-200 rounded-xl overflow-hidden">

        <summary
            class="flex items-center gap-2 px-4 py-3 text-sm text-gray-700 cursor-pointer select-none hover:bg-gray-50">

            <!-- Chevron that rotates on open -->
            <svg class="w-4 h-4 text-gray-600 transition-transform duration-200 
                        group-open:rotate-90"
                fill="none" stroke="currentColor" stroke-width="2"
                viewBox="0 0 24 24">
            <!-- ▶ shape -->
            <polyline points="9 6 15 12 9 18"/>
            </svg>

            <span>Advanced Settings</span>
        </summary>

         <div class="px-4 pt-4 pb-4 space-y-4 border-t border-gray-100">

          <!-- Importance -->
          <div class="space-y-1">
            <label for="importance" class="text-sm font-medium">Importance *</label>
            <div class="relative">
              <select id="importance"
                      class="w-full  rounded-lg px-3 py-2 bg-gray-100 pr-10 appearance-none">
                <option value="">Select importance level</option>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
                <option value="Critical">Critical</option>
              </select>

              <svg class="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500 pointer-events-none"
                   fill="none" stroke="currentColor" stroke-width="2"
                   viewBox="0 0 24 24">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </div>

            <p class="text-xs text-gray-500">
              Higher importance increases priority when nearing expiry.
            </p>
          </div>

        <div class="space-y-1">
        <label for="notes" class="block text-sm font-medium">Notes (optional)</label>
         <textarea id="notes" class="w-full bg-gray-100 rounded-lg px-3 py-2" placeholder="Additional notes"></textarea>
        </div>
        

        </div>
      </details>

      <!-- Confirm/Cancel Buttons -->
      <div class="flex gap-3 pt-2">
        <button type="submit"
                class="flex-1 bg-blue-600 hover:bg-blue-700 text-white rounded-lg py-2">
          Add Document
        </button>

        <button type="button"
                onclick="closeModal()"
                class="border border-gray-300 rounded-lg px-5 py-2 text-gray-700 hover:bg-gray-100">
          Cancel
        </button>
      </div>

    </form>

  </div>
